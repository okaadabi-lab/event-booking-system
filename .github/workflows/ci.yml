name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mbstring, intl
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHP_CodeSniffer (PSR-12)
        run: vendor/bin/phpcs
      - name: PHPStan (level 8)
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: event_booking_test
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USERNAME: app
      DB_PASSWORD: app
      DB_TEST_DATABASE: event_booking_test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mbstring, intl
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPUnit (unit, integration, http)
        run: vendor/bin/phpunit
